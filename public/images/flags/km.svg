<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <!-- Top Blue Band -->
  <rect width="60" height="10" y="0" fill="#032EA6"/>
  <!-- Middle Red Band -->
  <rect width="60" height="20" y="10" fill="#ED1B24"/>
  <!-- Bottom Blue Band -->
  <rect width="60" height="10" y="30" fill="#032EA6"/>
  
  <!-- Angkor Wat Temple (Centered in Red Band, y=10..30, x=15..45) -->
  <g fill="#FFFFFF">
    <!-- Stepped base plinth -->
    <rect x="18" y="27" width="24" height="1.5" rx="0.3"/>
    <rect x="20" y="25" width="20" height="2"/>
    <rect x="22" y="23.5" width="16" height="1.5"/>

    <!-- Central Tower (Tallest) -->
    <!-- Tower body -->
    <path d="M 28.5 23.5 L 28.5 17 Q 28.5 13.5 30 11.5 Q 31.5 13.5 31.5 17 L 31.5 23.5 Z"/>
    <!-- Central Tower Finial / Spire -->
    <line x1="30" y1="10" x2="30" y2="12" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="30" cy="10" r="0.6" fill="#FFFFFF"/>
    <!-- Rings/Tiers on Central Tower -->
    <path d="M 27.8 19.5 H 32.2 M 28.2 16.5 H 31.8 M 28.8 14 H 31.2" stroke="#ED1B24" stroke-width="0.6"/>

    <!-- Left Tower -->
    <path d="M 23.5 23.5 L 23.5 19 Q 23.5 16 25 14.5 Q 26.5 16 26.5 19 L 26.5 23.5 Z"/>
    <line x1="25" y1="13.2" x2="25" y2="15" stroke="#FFFFFF" stroke-width="0.7"/>
    <circle cx="25" cy="13.2" r="0.5" fill="#FFFFFF"/>
    <path d="M 23 20.8 H 27 M 23.5 18 H 26.5" stroke="#ED1B24" stroke-width="0.5"/>

    <!-- Right Tower -->
    <path d="M 33.5 23.5 L 33.5 19 Q 33.5 16 35 14.5 Q 36.5 16 36.5 19 L 36.5 23.5 Z"/>
    <line x1="35" y1="13.2" x2="35" y2="15" stroke="#FFFFFF" stroke-width="0.7"/>
    <circle cx="35" cy="13.2" r="0.5" fill="#FFFFFF"/>
    <path d="M 33 20.8 H 37 M 33.5 18 H 36.5" stroke="#ED1B24" stroke-width="0.5"/>

    <!-- Connecting gallery walls & portal entry -->
    <rect x="26.5" y="21" width="2" height="2.5"/>
    <rect x="31.5" y="21" width="2" height="2.5"/>
    <path d="M 29.2 28.5 V 25.5 H 30.8 V 28.5 Z" fill="#ED1B24"/>
  </g>
</svg>
